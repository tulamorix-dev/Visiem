<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SANDRIS · Часы · Погода · Плеер</title>
<style>
  *{ margin:0; padding:0; box-sizing:border-box; }

  :root{
    --s: 320px;
    --cyan: #4dd0e1;
    --violet: #7c4dff;
  }

  @media (max-width: 560px){ :root{ --s: 240px; } }

  html, body{ min-height:100%; }

  body{
    display:flex;
    align-items:center;
    justify-content:center;
    background: radial-gradient(circle at 50% 15%, #1a2534 0%, #0a0e14 45%, #04060a 100%);
    font-family: "Segoe UI", system-ui, -apple-system, "Helvetica Neue", sans-serif;
    color:#e9f0f8;
    overflow-x:hidden;
    -webkit-font-smoothing: antialiased;
    padding: 24px 16px;
  }

  .wrap{
    display:flex;
    flex-direction:column;
    align-items:center;
    gap: clamp(14px, 3vh, 30px);
    animation: appear .9s cubic-bezier(.2,.8,.3,1) both;
    width:100%;
    max-width: 780px;
  }
  @keyframes appear{
    from{ opacity:0; transform: translateY(18px) scale(.96); }
    to  { opacity:1; transform:none; }
  }

  /* ---------------- Имя ---------------- */
  .name{
    display:flex;
    justify-content:center;
    align-items:flex-end;
    gap: clamp(2px, 1.2vw, 8px);
    perspective: 380px;
    perspective-origin: 50% 60%;
    padding: 10px 4px 6px;
    user-select: none;
    min-height: clamp(56px, 13vw, 86px);
  }

  .name-letter{
    display:inline-block;
    font-size: clamp(34px, 9vw, 60px);
    font-weight: 700;
    letter-spacing: .02em;
    line-height: 1;
    color: #e9f0f8;
    transform-origin: 50% 100%;
    will-change: transform, color, text-shadow;
    transition: color .2s, text-shadow .2s;
    text-shadow:
      0 0 14px rgba(77,208,225,.55),
      0 0 32px rgba(77,208,225,.25);
    backface-visibility: visible;
    transform-style: preserve-3d;
  }

  /* Переключатель режимов */
  .mode-switch{
    display: flex;
    gap: 6px;
    justify-content: center;
    margin-top: -4px;
  }

  .mode-btn{
    font-family: inherit;
    font-size: 11px;
    letter-spacing: .12em;
    text-transform: uppercase;
    padding: 5px 12px;
    border-radius: 999px;
    border: 1px solid rgba(255,255,255,.1);
    background: rgba(255,255,255,.03);
    color: rgba(233,240,248,.55);
    cursor: pointer;
    transition: background .2s, border-color .2s, color .2s, transform .15s;
  }
  .mode-btn:hover{
    background: rgba(77,208,225,.1);
    border-color: rgba(77,208,225,.35);
    color: #fff;
  }
  .mode-btn:active{ transform: scale(.94); }
  .mode-btn.active{
    background: rgba(77,208,225,.18);
    border-color: rgba(77,208,225,.55);
    color: var(--cyan);
    box-shadow: 0 0 14px -4px rgba(77,208,225,.6);
  }

  /* ---------------- Часы ---------------- */
  .clock{
    position:relative;
    width:var(--s);
    height:var(--s);
    border-radius:50%;
    background:
      radial-gradient(circle at 50% 32%, rgba(255,255,255,.10), rgba(255,255,255,0) 62%),
      linear-gradient(160deg, #18222f 0%, #0b1018 100%);
    box-shadow:
      0 0 0 1px rgba(255,255,255,.07),
      0 0 0 9px rgba(255,255,255,.018),
      0 30px 70px -18px rgba(0,0,0,.95),
      inset 0 0 70px rgba(0,0,0,.75),
      0 0 90px -25px var(--cyan);
  }
  .clock::before{
    content:'';
    position:absolute;
    inset:-1px;
    border-radius:50%;
    background: conic-gradient(from 0deg,
        rgba(77,208,225,0)   0deg,
        rgba(77,208,225,.85) 55deg,
        rgba(124,77,255,.85) 115deg,
        rgba(77,208,225,0)   175deg,
        rgba(77,208,225,0)   360deg);
    -webkit-mask: radial-gradient(farthest-side,
        #0000 calc(100% - 16px), #000 calc(100% - 15px),
        #000  calc(100% - 3px),  #0000 calc(100% - 2px));
    mask: radial-gradient(farthest-side,
        #0000 calc(100% - 16px), #000 calc(100% - 15px),
        #000  calc(100% - 3px),  #0000 calc(100% - 2px));
    animation: spin 9s linear infinite;
    pointer-events:none;
    z-index: 8;
  }
  @keyframes spin{ to{ transform: rotate(360deg); } }

  #viz{
    position:absolute;
    inset:0;
    width:100%;
    height:100%;
    border-radius:50%;
    pointer-events:none;
    z-index:1;
  }

  .tick{
    position:absolute;
    inset:0;
    transform-origin:50% 50%;
    pointer-events:none;
    z-index:3;
  }
  .tick::before{
    content:'';
    position:absolute;
    top: calc(var(--s) * .028);
    left:50%;
    width:2px;
    height: calc(var(--s) * .022);
    border-radius:2px;
    background: rgba(255,255,255,.16);
    transform: translateX(-50%);
  }
  .tick.major::before{
    width:4px;
    height: calc(var(--s) * .048);
    background: linear-gradient(to bottom, rgba(255,255,255,.9), rgba(255,255,255,.35));
    box-shadow: 0 0 8px rgba(255,255,255,.35);
  }
  .number{
    position:absolute;
    inset:0;
    display:flex;
    justify-content:center;
    align-items:flex-start;
    pointer-events:none;
    z-index:3;
  }
  .number span{
    margin-top: calc(var(--s) * .115);
    font-size: calc(var(--s) * .068);
    font-weight:600;
    letter-spacing:.02em;
    color: rgba(233,240,248,.85);
    text-shadow: 0 0 12px rgba(77,208,225,.35);
  }
  .hand{
    position:absolute;
    left:50%;
    bottom:50%;
    border-radius:99px;
    transform-origin:50% 100%;
    will-change: transform;
    z-index:5;
  }
  .hour{
    width:6px;
    height: calc(var(--s) * .27);
    margin-left:-3px;
    background: linear-gradient(to top, #9fb4c9, #eaf3ff);
    box-shadow: 0 0 12px rgba(0,0,0,.6);
  }
  .minute{
    width:4px;
    height: calc(var(--s) * .375);
    margin-left:-2px;
    background: linear-gradient(to top, #b6c9dd, #ffffff);
    box-shadow: 0 0 12px rgba(0,0,0,.6);
    z-index:6;
  }
  .second{
    width:2px;
    height: calc(var(--s) * .45);
    margin-left:-1px;
    bottom: calc(50% - var(--s) * .07);
    transform-origin: 50% calc(100% - var(--s) * .07);
    background: linear-gradient(to top, var(--cyan), #ffffff 60%);
    box-shadow: 0 0 8px var(--cyan), 0 0 18px rgba(77,208,225,.7);
    z-index:7;
  }
  .cap{
    position:absolute;
    left:50%; top:50%;
    width:16px; height:16px;
    margin:-8px 0 0 -8px;
    border-radius:50%;
    background: radial-gradient(circle at 35% 32%, #ffffff, #93a7bd 55%, #2b3646);
    box-shadow: 0 0 0 3px rgba(8,12,18,.95), 0 0 16px rgba(77,208,225,.55);
    z-index:9;
  }

  /* ---------------- Цифровое время ---------------- */
  .digital{ text-align:center; user-select:none; }
  .time{
    font-size: clamp(28px, 7vw, 44px);
    font-weight:300;
    letter-spacing:.12em;
    font-variant-numeric: tabular-nums;
    background: linear-gradient(180deg, #ffffff, #8fb6c9);
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
    filter: drop-shadow(0 0 18px rgba(77,208,225,.35));
  }
  .date{
    margin-top:10px;
    font-size: clamp(11px, 2.6vw, 13px);
    letter-spacing:.2em;
    text-transform: uppercase;
    color: rgba(233,240,248,.45);
  }

  /* ---------------- Погода ---------------- */
  .weather{
    width:100%;
    margin-top: 4px;
    animation: appear 1.2s .3s cubic-bezier(.2,.8,.3,1) both;
  }
  .weather-title{
    display:flex;
    align-items:center;
    justify-content:center;
    gap:8px;
    font-size: clamp(12px, 2.8vw, 14px);
    letter-spacing:.18em;
    text-transform:uppercase;
    color: rgba(233,240,248,.55);
    margin-bottom:14px;
  }
  .weather-title svg{
    width:16px; height:16px;
    stroke: var(--cyan);
    fill:none;
    stroke-width:2;
    opacity:.8;
  }
  .hourly{
    display:flex;
    gap:10px;
    overflow-x:auto;
    padding: 4px 2px 12px;
    scroll-snap-type:x mandatory;
    scrollbar-width:thin;
    scrollbar-color: rgba(77,208,225,.35) transparent;
  }
  .hourly::-webkit-scrollbar{ height:4px; }
  .hourly::-webkit-scrollbar-thumb{
    background: rgba(77,208,225,.35);
    border-radius:4px;
  }
  .hour-card{
    flex: 0 0 auto;
    scroll-snap-align:start;
    width: 82px;
    padding: 14px 6px 12px;
    border-radius: 18px;
    background: linear-gradient(165deg, rgba(255,255,255,.07), rgba(255,255,255,.015));
    border: 1px solid rgba(255,255,255,.07);
    box-shadow: 0 8px 22px -12px rgba(0,0,0,.8);
    text-align:center;
    transition: transform .2s, border-color .2s, box-shadow .2s;
    cursor: pointer;
    outline: none;
  }
  .hour-card:hover,
  .hour-card:focus-visible{
    transform: translateY(-3px);
    border-color: rgba(77,208,225,.35);
    box-shadow: 0 12px 28px -14px rgba(77,208,225,.4);
  }
  .hour-card.now{
    border-color: rgba(77,208,225,.55);
    background: linear-gradient(165deg, rgba(77,208,225,.12), rgba(77,208,225,.03));
    box-shadow: 0 0 22px -6px rgba(77,208,225,.5);
  }
  .hour-time{
    font-size:11px;
    font-weight:600;
    letter-spacing:.08em;
    color: rgba(233,240,248,.6);
    margin-bottom:6px;
  }
  .hour-card.now .hour-time{ color: var(--cyan); }
  .hour-icon{
    font-size: 24px;
    line-height:1;
    margin-bottom:6px;
    filter: drop-shadow(0 0 6px rgba(255,255,255,.25));
  }
  .hour-temp{
    font-size:15px;
    font-weight:600;
    font-variant-numeric: tabular-nums;
    color:#ffffff;
    margin-bottom:4px;
  }
  .hour-extra{
    font-size:10px;
    color: rgba(233,240,248,.4);
    letter-spacing:.04em;
  }
  .weather-error{
    text-align:center;
    font-size:13px;
    color: rgba(233,240,248,.4);
    padding: 18px 0;
  }
  .skeleton{
    display:flex;
    gap:10px;
    overflow:hidden;
    padding: 4px 2px 12px;
  }
  .skeleton-card{
    flex:0 0 auto;
    width:82px;
    height: 118px;
    border-radius:18px;
    background: linear-gradient(90deg,
      rgba(255,255,255,.04) 25%,
      rgba(255,255,255,.09) 50%,
      rgba(255,255,255,.04) 75%);
    background-size:200% 100%;
    animation: shimmer 1.4s infinite;
  }
  @keyframes shimmer{
    0%{ background-position:200% 0; }
    100%{ background-position:-200% 0; }
  }

  /* ---------------- Модальное окно ---------------- */
  .modal-overlay{
    position: fixed;
    inset: 0;
    background: rgba(4,6,10,.72);
    backdrop-filter: blur(10px);
    -webkit-backdrop-filter: blur(10px);
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
    z-index: 100;
    opacity: 0;
    pointer-events: none;
    transition: opacity .3s ease;
  }
  .modal-overlay.open{
    opacity: 1;
    pointer-events: auto;
  }
  .modal{
    position: relative;
    width: 100%;
    max-width: 440px;
    max-height: calc(100vh - 40px);
    overflow-y: auto;
    background:
      radial-gradient(circle at 50% 0%, rgba(77,208,225,.14), transparent 55%),
      linear-gradient(165deg, #1a2534 0%, #0b1018 100%);
    border: 1px solid rgba(255,255,255,.09);
    border-radius: 26px;
    padding: 28px 24px 24px;
    box-shadow:
      0 30px 80px -20px rgba(0,0,0,.95),
      0 0 90px -30px var(--cyan),
      inset 0 0 0 1px rgba(255,255,255,.02);
    transform: translateY(24px) scale(.95);
    opacity: 0;
    transition: transform .38s cubic-bezier(.2,.8,.3,1), opacity .3s;
  }
  .modal-overlay.open .modal{
    transform: none;
    opacity: 1;
  }
  .modal-close{
    position: absolute;
    top: 14px; right: 14px;
    width: 34px; height: 34px;
    border-radius: 50%;
    border: 1px solid rgba(255,255,255,.1);
    background: rgba(255,255,255,.04);
    color: rgba(233,240,248,.7);
    font-size: 18px;
    line-height: 1;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: background .2s, color .2s, transform .2s;
  }
  .modal-close:hover{
    background: rgba(77,208,225,.15);
    color: #fff;
    transform: rotate(90deg);
  }

  .modal-head{
    text-align: center;
    padding-bottom: 20px;
    border-bottom: 1px solid rgba(255,255,255,.07);
  }
  .modal-when{
    font-size: 12px;
    letter-spacing: .16em;
    text-transform: uppercase;
    color: rgba(233,240,248,.5);
    margin-bottom: 14px;
  }
  .modal-icon{
    font-size: 58px;
    line-height: 1;
    margin-bottom: 6px;
    filter: drop-shadow(0 0 24px rgba(77,208,225,.45));
    animation: floaty 3s ease-in-out infinite;
  }
  @keyframes floaty{
    0%,100%{ transform: translateY(0); }
    50%    { transform: translateY(-5px); }
  }
  .modal-temp{
    font-size: 44px;
    font-weight: 300;
    letter-spacing: -.01em;
    color: #fff;
    text-shadow: 0 0 30px rgba(77,208,225,.35);
    font-variant-numeric: tabular-nums;
  }
  .modal-desc{
    margin-top: 4px;
    font-size: 14px;
    color: rgba(233,240,248,.65);
    letter-spacing:.04em;
  }

  .modal-grid{
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px;
    margin-top: 20px;
  }
  .detail{
    padding: 12px 14px;
    border-radius: 14px;
    background: linear-gradient(165deg, rgba(255,255,255,.05), rgba(255,255,255,.015));
    border: 1px solid rgba(255,255,255,.06);
    transition: border-color .2s, background .2s;
  }
  .detail:hover{
    border-color: rgba(77,208,225,.3);
    background: linear-gradient(165deg, rgba(77,208,225,.08), rgba(255,255,255,.02));
  }
  .detail-label{
    font-size: 10.5px;
    letter-spacing: .1em;
    text-transform: uppercase;
    color: rgba(233,240,248,.45);
    margin-bottom: 5px;
    display: flex;
    align-items: center;
    gap: 5px;
  }
  .detail-value{
    font-size: 15px;
    font-weight: 600;
    color: #fff;
    font-variant-numeric: tabular-nums;
  }
  .detail-value small{
    font-size: 11px;
    font-weight: 400;
    color: rgba(233,240,248,.5);
    margin-left: 2px;
  }
  .detail.wide{ grid-column: 1 / -1; }

  .wind-arrow{
    display:inline-block;
    transition: transform .4s;
    font-size: 13px;
  }

  /* ---------------- Плеер ---------------- */
  .player{
    width:100%;
    margin-top: 4px;
    animation: appear 1.4s .5s cubic-bezier(.2,.8,.3,1) both;
  }
  .player-title{
    display:flex;
    align-items:center;
    justify-content:center;
    gap:8px;
    font-size: clamp(12px, 2.8vw, 14px);
    letter-spacing:.18em;
    text-transform:uppercase;
    color: rgba(233,240,248,.55);
    margin-bottom:14px;
  }
  .player-title svg{
    width:16px; height:16px;
    stroke: var(--cyan);
    fill:none;
    stroke-width:2;
    opacity:.8;
  }
  .player-box{
    padding: 16px 18px;
    border-radius: 20px;
    background: linear-gradient(165deg, rgba(255,255,255,.06), rgba(255,255,255,.015));
    border: 1px solid rgba(255,255,255,.07);
    box-shadow: 0 8px 22px -12px rgba(0,0,0,.8);
  }
  .player-file{
    display:flex;
    align-items:center;
    gap:10px;
    margin-bottom:14px;
  }
  .player-btn{
    flex-shrink:0;
    width: 42px; height: 42px;
    border-radius: 50%;
    border: 1px solid rgba(255,255,255,.1);
    background: rgba(255,255,255,.04);
    color: #e9f0f8;
    font-size: 18px;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: background .2s, border-color .2s, transform .15s;
  }
  .player-btn:hover:not(:disabled){
    background: rgba(77,208,225,.15);
    border-color: rgba(77,208,225,.4);
  }
  .player-btn:active:not(:disabled){
    transform: scale(.92);
  }
  .player-btn:disabled{
    opacity: .35;
    cursor: not-allowed;
  }
  .player-btn.play{
    background: rgba(77,208,225,.18);
    border-color: rgba(77,208,225,.5);
    color: var(--cyan);
  }
  .player-btn.play:hover:not(:disabled){
    background: rgba(77,208,225,.28);
  }
  .player-info{
    flex-grow:1;
    min-width:0;
  }
  .player-name{
    font-size: 13px;
    font-weight: 600;
    color: #fff;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .player-status{
    font-size: 11px;
    color: rgba(233,240,248,.45);
    margin-top: 2px;
    letter-spacing: .04em;
    font-variant-numeric: tabular-nums;
  }
  .player-progress{
    width:100%;
    height: 4px;
    border-radius: 4px;
    background: rgba(255,255,255,.08);
    overflow: hidden;
    margin-bottom: 12px;
    cursor: pointer;
  }
  .player-progress-fill{
    height:100%;
    width:0%;
    background: linear-gradient(90deg, var(--violet), var(--cyan));
    border-radius: 4px;
    transition: width .15s linear;
  }
  .player-controls{
    display:flex;
    align-items:center;
    justify-content:center;
    gap:12px;
  }
  .player-volume{
    display:flex;
    align-items:center;
    gap:6px;
    margin-left: 8px;
  }
  .player-volume svg{
    width:16px; height:16px;
    stroke: rgba(233,240,248,.5);
    fill:none;
    stroke-width:2;
    flex-shrink:0;
  }
  .player-volume input[type="range"]{
    -webkit-appearance: none;
    appearance: none;
    width: 70px;
    height: 3px;
    border-radius: 3px;
    background: rgba(255,255,255,.1);
    outline: none;
    cursor: pointer;
  }
  .player-volume input[type="range"]::-webkit-slider-thumb{
    -webkit-appearance: none;
    appearance: none;
    width: 12px; height: 12px;
    border-radius: 50%;
    background: var(--cyan);
    box-shadow: 0 0 6px rgba(77,208,225,.6);
    cursor: pointer;
  }
  .player-volume input[type="range"]::-moz-range-thumb{
    width: 12px; height: 12px;
    border-radius: 50%;
    background: var(--cyan);
    border: none;
    box-shadow: 0 0 6px rgba(77,208,225,.6);
    cursor: pointer;
  }
  .player-hint{
    text-align: center;
    font-size: 11px;
    color: rgba(233,240,248,.35);
    margin-top: 10px;
    letter-spacing: .04em;
  }
</style>
</head>
<body>

  <div class="wrap">

    <!-- Имя -->
    <div class="name" id="name" aria-label="SANDRIS"></div>

    <div class="mode-switch" role="tablist" aria-label="Режим анимации имени">
      <button class="mode-btn" data-mode="top" type="button">Волчок</button>
      <button class="mode-btn" data-mode="swing" type="button">Качели</button>
      <button class="mode-btn active" data-mode="cube" type="button">Кубик</button>
    </div>

    <!-- Часы с визуализацией -->
    <div class="clock">
      <canvas id="viz" width="640" height="640"></canvas>
      <div class="hand hour"></div>
      <div class="hand minute"></div>
      <div class="hand second"></div>
      <div class="cap"></div>
    </div>

    <div class="digital">
      <div class="time" id="time">00:00:00</div>
      <div class="date" id="date">—</div>
    </div>

    <!-- Погода -->
    <div class="weather">
      <div class="weather-title">
        <svg viewBox="0 0 24 24" stroke-linecap="round" stroke-linejoin="round">
          <path d="M17.5 19a4.5 4.5 0 0 0 0-9h-1.1A7 7 0 1 0 4 16.9"/>
          <path d="M12 15v6"/>
          <path d="M9 18l3 3 3-3"/>
        </svg>
        Погода в Валмиере · почасово
      </div>
      <div id="weatherContent">
        <div class="skeleton" id="weatherSkeleton">
          <div class="skeleton-card"></div>
          <div class="skeleton-card"></div>
          <div class="skeleton-card"></div>
          <div class="skeleton-card"></div>
          <div class="skeleton-card"></div>
          <div class="skeleton-card"></div>
        </div>
      </div>
    </div>

    <!-- Плеер -->
    <div class="player">
      <div class="player-title">
        <svg viewBox="0 0 24 24" stroke-linecap="round" stroke-linejoin="round">
          <path d="M9 18V5l12-2v13"/>
          <circle cx="6" cy="18" r="3"/>
          <circle cx="18" cy="16" r="3"/>
        </svg>
        Локальный плеер
      </div>
      <div class="player-box">
        <div class="player-file">
          <button class="player-btn" id="btnSelect" title="Выбрать файлы">＋</button>
          <div class="player-info">
            <div class="player-name" id="playerName">Файлы не выбраны</div>
            <div class="player-status" id="playerStatus">—</div>
          </div>
        </div>
        <div class="player-progress" id="playerProgress">
          <div class="player-progress-fill" id="playerProgressFill"></div>
        </div>
        <div class="player-controls">
          <button class="player-btn" id="btnPrev" disabled title="Предыдущий">⏮</button>
          <button class="player-btn play" id="btnPlay" disabled title="Воспроизвести">▶</button>
          <button class="player-btn" id="btnNext" disabled title="Следующий">⏭</button>
          <div class="player-volume">
            <svg viewBox="0 0 24 24"><path d="M11 5L6 9H2v6h4l5 4V5z"/><path d="M19.07 4.93a10 10 0 0 1 0 14.14M15.54 8.46a5 5 0 0 1 0 7.07"/></svg>
            <input type="range" id="volume" min="0" max="1" step="0.05" value="1">
          </div>
        </div>
        <div class="player-hint">Выберите аудиофайлы с устройства</div>
      </div>
    </div>

  </div>

  <!-- Модальное окно с деталями погоды -->
  <div class="modal-overlay" id="modalOverlay">
    <div class="modal" role="dialog" aria-modal="true">
      <button class="modal-close" id="modalClose" aria-label="Закрыть">✕</button>
      <div id="modalContent"></div>
    </div>
  </div>

<script>
(function () {
  /* ============================================================
     1. ИМЯ
     ============================================================ */
  const NAME = 'SANDRIS';
  const nameEl = document.getElementById('name');
  const letterEls = [];

  for (const ch of NAME) {
    const span = document.createElement('span');
    span.className = 'name-letter';
    span.textContent = ch;
    nameEl.appendChild(span);
    letterEls.push(span);
  }

  /* ============================================================
     2. ЧАСЫ
     ============================================================ */
  const clock = document.querySelector('.clock');

  for (let i = 0; i < 60; i++) {
    const t = document.createElement('div');
    t.className = 'tick' + (i % 5 === 0 ? ' major' : '');
    t.style.transform = `rotate(${i * 6}deg)`;
    clock.appendChild(t);
  }
  for (let i = 1; i <= 12; i++) {
    const n = document.createElement('div');
    n.className = 'number';
    n.style.transform = `rotate(${i * 30}deg)`;
    const s = document.createElement('span');
    s.textContent = i;
    s.style.transform = `rotate(${-i * 30}deg)`;
    n.appendChild(s);
    clock.appendChild(n);
  }

  const hourHand   = document.querySelector('.hour');
  const minuteHand = document.querySelector('.minute');
  const secondHand = document.querySelector('.second');
  const timeEl     = document.getElementById('time');
  const dateEl     = document.getElementById('date');

  const DAYS   = ['воскресенье','понедельник','вторник','среда','четверг','пятница','суббота'];
  const MONTHS = ['января','февраля','марта','апреля','мая','июня',
                  'июля','августа','сентября','октября','ноября','декабря'];
  const pad = n => String(n).padStart(2, '0');

  let lastSecond = -1;
  function frame() {
    const now = new Date();
    const sec = now.getSeconds() + now.getMilliseconds() / 1000;
    const min = now.getMinutes() + sec / 60;
    const hr  = (now.getHours() % 12) + min / 60;

    secondHand.style.transform = `rotate(${sec * 6}deg)`;
    minuteHand.style.transform = `rotate(${min * 6}deg)`;
    hourHand.style.transform   = `rotate(${hr * 30}deg)`;

    if (now.getSeconds() !== lastSecond) {
      lastSecond = now.getSeconds();
      timeEl.textContent = `${pad(now.getHours())}:${pad(now.getMinutes())}:${pad(now.getSeconds())}`;
      dateEl.textContent = `${DAYS[now.getDay()]}, ${now.getDate()} ${MONTHS[now.getMonth()]} ${now.getFullYear()}`;
    }
    requestAnimationFrame(frame);
  }
  frame();

  /* ============================================================
     3. ПОГОДА
     ============================================================ */
  const LAT = 57.5411;
  const LON = 25.4275;
  const TZ  = 'Europe/Riga';

  const WMO = {
    0:'☀️', 1:'🌤️', 2:'⛅', 3:'☁️',
    45:'🌫️', 48:'🌫️',
    51:'🌦️', 53:'🌦️', 55:'🌧️',
    56:'🌧️', 57:'🌧️',
    61:'🌧️', 63:'🌧️', 65:'🌧️',
    66:'🌧️', 67:'🌧️',
    71:'🌨️', 73:'🌨️', 75:'❄️', 77:'❄️',
    80:'🌦️', 81:'🌧️', 82:'⛈️',
    85:'🌨️', 86:'❄️',
    95:'⛈️', 96:'⛈️', 99:'⛈️'
  };
  const WMO_TEXT = {
    0:'Ясно', 1:'Преимущественно ясно', 2:'Переменная облачность', 3:'Пасмурно',
    45:'Туман', 48:'Изморозь',
    51:'Слабая морось', 53:'Морось', 55:'Сильная морось',
    56:'Ледяная морось', 57:'Ледяная морось',
    61:'Небольшой дождь', 63:'Дождь', 65:'Сильный дождь',
    66:'Ледяной дождь', 67:'Ледяной дождь',
    71:'Небольшой снег', 73:'Снег', 75:'Сильный снег', 77:'Снежная крупа',
    80:'Небольшой ливень', 81:'Ливень', 82:'Сильный ливень',
    85:'Снегопад', 86:'Сильный снегопад',
    95:'Гроза', 96:'Гроза с градом', 99:'Сильная гроза с градом'
  };
  const CARDINALS = ['С','СВ','В','ЮВ','Ю','ЮЗ','З','СЗ'];

  const weatherBox = document.getElementById('weatherContent');
  const overlay    = document.getElementById('modalOverlay');
  const modalBox   = document.getElementById('modalContent');
  const modalClose = document.getElementById('modalClose');

  let cache = null;

  function nowInTz(tz) {
    const parts = new Intl.DateTimeFormat('en-CA', {
      timeZone: tz,
      year: 'numeric', month: '2-digit', day: '2-digit',
      hour: '2-digit', hour12: false
    }).formatToParts(new Date());
    const get = type => parts.find(p => p.type === type).value;
    let hour = get('hour');
    if (hour === '24') hour = '00';
    return `${get('year')}-${get('month')}-${get('day')}T${hour}`;
  }

  async function loadWeather() {
    const params = new URLSearchParams({
      latitude:  LAT,
      longitude: LON,
      hourly: [
        'temperature_2m','apparent_temperature','relative_humidity_2m',
        'precipitation','precipitation_probability','weathercode',
        'wind_speed_10m','wind_direction_10m','wind_gusts_10m',
        'pressure_msl','cloud_cover','visibility','uv_index'
      ].join(','),
      timezone: TZ,
      forecast_days: 2,
      models: 'best_match'
    });

    try {
      const res = await fetch('https://api.open-meteo.com/v1/forecast?' + params);
      if (!res.ok) throw new Error('HTTP ' + res.status);
      cache = await res.json();
      renderHourly(cache);
    } catch (e) {
      console.error(e);
      weatherBox.innerHTML =
        '<div class="weather-error">Не удалось загрузить прогноз. Попробуйте обновить страницу.</div>';
    }
  }

  function renderHourly(data) {
    const h = data && data.hourly;
    if (!h || !h.time || !h.time.length) {
      weatherBox.innerHTML = '<div class="weather-error">Нет данных о погоде.</div>';
      return;
    }

    const nowKey = nowInTz(data.timezone || TZ);
    let startIndex = h.time.findIndex(t => t.slice(0, 13) >= nowKey);
    if (startIndex < 0) startIndex = 0;

    const COUNT = 12;
    const items = [];

    for (let i = 0; i < COUNT && (startIndex + i) < h.time.length; i++) {
      const idx = startIndex + i;
      const timeStr = h.time[idx];
      const hour    = parseInt(timeStr.slice(11, 13), 10);
      const temp    = Math.round(h.temperature_2m[idx]);
      const code    = h.weathercode[idx];
      const precip  = h.precipitation_probability?.[idx] ?? null;
      const wind    = Math.round(h.wind_speed_10m?.[idx] ?? 0);

      const isNow = timeStr.slice(0, 13) === nowKey;
      const icon  = WMO[code] || '❓';
      const desc  = WMO_TEXT[code] || '—';

      items.push(`
        <div class="hour-card${isNow ? ' now' : ''}"
             data-idx="${idx}"
             role="button"
             tabindex="0"
             title="Нажмите, чтобы увидеть подробности">
          <div class="hour-time">${isNow ? 'Сейчас' : pad(hour) + ':00'}</div>
          <div class="hour-icon" title="${desc}">${icon}</div>
          <div class="hour-temp">${temp}°</div>
          <div class="hour-extra">💧${precip !== null ? precip + '%' : '—'} 💨${wind}</div>
        </div>
      `);
    }
    weatherBox.innerHTML = `<div class="hourly">${items.join('')}</div>`;
  }

  function uvLabel(uv) {
    if (uv == null) return '';
    const v = Math.round(uv);
    if (v <= 2) return 'низкий';
    if (v <= 5) return 'средний';
    if (v <= 7) return 'высокий';
    if (v <= 10) return 'очень высокий';
    return 'экстремальный';
  }

  function openModal(idx) {
    const h = cache && cache.hourly;
    if (!h || !h.time || !h.time[idx]) return;

    const timeStr = h.time[idx];
    const [datePart, timePart] = timeStr.split('T');
    const hour    = parseInt(timePart.slice(0, 2), 10);

    const temp    = h.temperature_2m[idx];
    const feels   = h.apparent_temperature?.[idx];
    const code    = h.weathercode[idx];
    const hum     = h.relative_humidity_2m?.[idx];
    const precip  = h.precipitation?.[idx];
    const pProb   = h.precipitation_probability?.[idx];
    const windSpd = h.wind_speed_10m?.[idx];
    const windDeg = h.wind_direction_10m?.[idx];
    const gusts   = h.wind_gusts_10m?.[idx];
    const press   = h.pressure_msl?.[idx];
    const clouds  = h.cloud_cover?.[idx];
    const vis     = h.visibility?.[idx];
    const uv      = h.uv_index?.[idx];

    const icon = WMO[code] || '❓';
    const desc = WMO_TEXT[code] || '—';
    const nowKey = nowInTz(TZ);
    const isNow = timeStr.slice(0, 13) === nowKey;

    const d = new Date(datePart + 'T12:00:00');
    const dateLine = `${DAYS[d.getDay()]}, ${d.getDate()} ${MONTHS[d.getMonth()]}`;

    const windDirName = (windDeg != null)
      ? CARDINALS[Math.round(windDeg / 45) % 8]
      : '—';
    const windArrowRot = (windDeg != null) ? windDeg : 0;

    const visKm = (vis != null) ? (vis / 1000).toFixed(vis >= 10000 ? 0 : 1) : null;
    const uvText = uv != null ? `${Math.round(uv)} <small>${uvLabel(uv)}</small>` : '—';

    modalBox.innerHTML = `
      <div class="modal-head">
        <div class="modal-when">${isNow ? 'Сейчас' : pad(hour) + ':00'} · ${dateLine}</div>
        <div class="modal-icon">${icon}</div>
        <div class="modal-temp">${Math.round(temp)}°</div>
        <div class="modal-desc">${desc}</div>
      </div>

      <div class="modal-grid">
        <div class="detail">
          <div class="detail-label">🌡 Ощущается</div>
          <div class="detail-value">${feels != null ? Math.round(feels) + '°' : '—'}</div>
        </div>
        <div class="detail">
          <div class="detail-label">💧 Влажность</div>
          <div class="detail-value">${hum != null ? Math.round(hum) + '<small>%</small>' : '—'}</div>
        </div>

        <div class="detail">
          <div class="detail-label">🌬 Ветер</div>
          <div class="detail-value">
            <span class="wind-arrow" style="transform: rotate(${windArrowRot}deg)">↓</span>
            ${windSpd != null ? Math.round(windSpd) + '<small>км/ч</small>' : '—'}
            <small>${windDirName}</small>
          </div>
        </div>
        <div class="detail">
          <div class="detail-label">💨 Порывы</div>
          <div class="detail-value">${gusts != null ? Math.round(gusts) + '<small>км/ч</small>' : '—'}</div>
        </div>

        <div class="detail">
          <div class="detail-label">📊 Давление</div>
          <div class="detail-value">${press != null ? Math.round(press) + '<small>гПа</small>' : '—'}</div>
        </div>
        <div class="detail">
          <div class="detail-label">☁️ Облачность</div>
          <div class="detail-value">${clouds != null ? Math.round(clouds) + '<small>%</small>' : '—'}</div>
        </div>

        <div class="detail">
          <div class="detail-label">🌧 Осадки</div>
          <div class="detail-value">
            ${precip != null ? Number(precip).toFixed(1) + '<small>мм</small>' : '—'}
            ${pProb != null ? `<small>· ${Math.round(pProb)}%</small>` : ''}
          </div>
        </div>
        <div class="detail">
          <div class="detail-label">👁 Видимость</div>
          <div class="detail-value">${visKm != null ? visKm + '<small>км</small>' : '—'}</div>
        </div>

        <div class="detail wide">
          <div class="detail-label">☀️ УФ-индекс</div>
          <div class="detail-value">${uvText}</div>
        </div>
      </div>
    `;

    overlay.classList.add('open');
  }

  function closeModal() { overlay.classList.remove('open'); }

  weatherBox.addEventListener('click', (e) => {
    const card = e.target.closest('.hour-card');
    if (!card || card.dataset.idx == null) return;
    openModal(parseInt(card.dataset.idx, 10));
  });

  weatherBox.addEventListener('keydown', (e) => {
    if (e.key !== 'Enter' && e.key !== ' ') return;
    const card = e.target.closest('.hour-card');
    if (!card || card.dataset.idx == null) return;
    e.preventDefault();
    openModal(parseInt(card.dataset.idx, 10));
  });

  modalClose.addEventListener('click', closeModal);
  overlay.addEventListener('click', (e) => { if (e.target === overlay) closeModal(); });
  document.addEventListener('keydown', (e) => {
    if (e.key === 'Escape' && overlay.classList.contains('open')) closeModal();
  });

  loadWeather();
  setInterval(() => { if (cache) renderHourly(cache); }, 30 * 1000);
  setInterval(loadWeather, 15 * 60 * 1000);

  /* ============================================================
     4. ПЛЕЕР + Web Audio
     ============================================================ */
  const audio        = new Audio();
  audio.crossOrigin  = 'anonymous';
  const btnSelect    = document.getElementById('btnSelect');
  const btnPlay      = document.getElementById('btnPlay');
  const btnPrev      = document.getElementById('btnPrev');
  const btnNext      = document.getElementById('btnNext');
  const volumeSlider = document.getElementById('volume');
  const playerName   = document.getElementById('playerName');
  const playerStatus = document.getElementById('playerStatus');
  const progressBar  = document.getElementById('playerProgress');
  const progressFill = document.getElementById('playerProgressFill');

  let files   = [];
  let current = 0;
  let objectURL = null;

  const fmtTime = (s) => {
    if (!isFinite(s)) return '0:00';
    const m = Math.floor(s / 60);
    const sec = Math.floor(s % 60);
    return `${m}:${String(sec).padStart(2,'0')}`;
  };

  function updateControls() {
    const has = files.length > 0;
    btnPlay.disabled = !has;
    btnPrev.disabled = !has || current === 0;
    btnNext.disabled = !has || current === files.length - 1;
  }

  /* ---------------- Web Audio ---------------- */
  const canvas = document.getElementById('viz');
  const ctx2d  = canvas.getContext('2d');

  let audioCtx    = null;
  let analyser    = null;
  let sourceNode  = null;
  let freqData    = null;

  let bassEnergy = 0;
  let midEnergy  = 0;
  let kickEnergy = 0;

  const RAYS = 64;
  const raySmooth = new Float32Array(RAYS);

  const decay = (v, target, up, down) =>
    v + (target - v) * (target > v ? up : down);

  function initAudioGraph() {
    if (audioCtx) return;
    try {
      const AC = window.AudioContext || window.webkitAudioContext;
      audioCtx = new AC();

      sourceNode = audioCtx.createMediaElementSource(audio);

      analyser = audioCtx.createAnalyser();
      analyser.fftSize = 256;
      analyser.smoothingTimeConstant = 0.8;

      sourceNode.connect(analyser);
      analyser.connect(audioCtx.destination);

      freqData = new Uint8Array(analyser.frequencyBinCount);
    } catch (e) {
      console.warn('Web Audio недоступен:', e);
    }
  }

  /* ---------------- Анимация букв имени ---------------- */
  let t0 = performance.now();
  let currentMode = 'cube';

  const modeButtons = document.querySelectorAll('.mode-btn');
  modeButtons.forEach(btn => {
    btn.addEventListener('click', () => {
      currentMode = btn.dataset.mode;
      modeButtons.forEach(b => b.classList.toggle('active', b === btn));
    });
  });

  function updateLetters() {
    const t = (performance.now() - t0) / 1000;

    const energy = Math.min(1, bassEnergy * 0.75 + midEnergy * 0.55 + kickEnergy * 0.5);

    for (let i = 0; i < letterEls.length; i++) {
      const el = letterEls[i];
      const phase = i * 0.55;

      let tx = 0, ty = 0;
      let rx = 0, ry = 0, rz = 0;
      let scale = 1;

      if (currentMode === 'top') {
        // ВОЛЧОК: постоянное вращение вокруг Y
        const spinSpeed = 0.8 + energy * 3.2;
        ry = Math.sin(t * spinSpeed + phase) * (30 + energy * 90);
        rx = Math.sin(t * 0.7 + phase) * 10 * energy;
        rz = Math.sin(t * 1.4 + phase) * 12 * energy;

        ty = -(bassEnergy * 16 + midEnergy * 6) *
             Math.abs(Math.sin(t * 4 + phase));
        scale = 1 + energy * 0.15;

      } else if (currentMode === 'swing') {
        // КАЧЕЛИ: сильное качание вокруг Z + наклон X
        const swingSpeed = 1.6 + energy * 2.0;
        rz = Math.sin(t * swingSpeed + phase) * (18 + energy * 45);
        rx = Math.sin(t * 1.1 + phase) * (10 + energy * 35);
        ry = Math.sin(t * 0.6 + phase) * 8 * energy;

        ty = -(bassEnergy * 12) * Math.abs(Math.sin(t * 5 + phase));
        tx = Math.sin(t * 1.3 + phase) * 4 * energy;
        scale = 1 + bassEnergy * 0.1;

      } else {
        // КУБИК: вращение по всем трём осям вразнобой
        const spinSpeed = 0.9 + energy * 2.4;

        rx = Math.sin(t * spinSpeed * 1.1 + phase * 1.7) * (25 + energy * 95);
        ry = Math.sin(t * spinSpeed * 0.9 + phase * 1.3) * (25 + energy * 95);
        rz = Math.sin(t * spinSpeed * 1.4 + phase * 0.9) * (15 + energy * 55);

        ty = -(bassEnergy * 20 + midEnergy * 10) *
             Math.abs(Math.sin(t * 4.5 + phase));
        tx = Math.sin(t * 1.6 + phase) * 5 * energy;

        scale = 1 + kickEnergy * 0.25 + energy * 0.08;
      }

      el.style.transform =
        `translate3d(${tx}px, ${ty}px, 0) ` +
        `rotateX(${rx}deg) ` +
        `rotateY(${ry}deg) ` +
        `rotateZ(${rz}deg) ` +
        `scale(${scale})`;

      const hue = 190 - energy * 70;
      const light = 60 + energy * 30;
      el.style.color = `hsl(${hue}, 90%, ${light}%)`;
      el.style.textShadow =
        `0 0 ${10 + energy * 30}px hsla(${hue}, 100%, 65%, ${0.5 + energy * 0.5}), ` +
        `0 0 ${24 + energy * 50}px hsla(${hue}, 100%, 60%, ${0.25 + energy * 0.4})`;
    }
  }

  /* ---------------- Визуализация в часах + главный цикл ---------------- */
  function drawViz() {
    const w = canvas.width;
    const h = canvas.height;
    const cx = w / 2;
    const cy = h / 2;

    ctx2d.clearRect(0, 0, w, h);

    const playing = !audio.paused && !audio.ended && audio.currentTime > 0;

    if (analyser && playing) {
      analyser.getByteFrequencyData(freqData);

      let s = 0;
      for (let i = 0; i < 8; i++) s += freqData[i];
      const bassTarget = Math.pow((s / 8) / 255, 1.2);
      bassEnergy = decay(bassEnergy, bassTarget, 0.6, 0.08);

      let sm = 0, cm = 0;
      for (let i = 8; i < 40; i++) { sm += freqData[i]; cm++; }
      const midTarget = Math.pow((sm / cm) / 255, 1.2);
      midEnergy = decay(midEnergy, midTarget, 0.4, 0.06);

      const kickTarget = bassTarget > 0.6 ? bassTarget : 0;
      kickEnergy = decay(kickEnergy, kickTarget, 0.7, 0.15);
    } else {
      bassEnergy = decay(bassEnergy, 0, 0.2, 0.05);
      midEnergy  = decay(midEnergy,  0, 0.2, 0.05);
      kickEnergy = decay(kickEnergy, 0, 0.2, 0.05);
    }

    const innerR = w * 0.24;
    const maxR   = w * 0.46;
    const step = 2 * Math.PI / RAYS;

    for (let i = 0; i < RAYS; i++) {
      let target = 0;

      if (analyser && playing && freqData) {
        const binCount = freqData.length;
        const tA = Math.pow(i / RAYS, 1.4);
        const tB = Math.pow((i + 1) / RAYS, 1.4);
        const b0 = Math.floor(tA * binCount);
        const b1 = Math.max(b0 + 1, Math.floor(tB * binCount));

        let sum = 0, cnt = 0;
        for (let b = b0; b < b1 && b < binCount; b++) { sum += freqData[b]; cnt++; }
        const avg = cnt ? sum / cnt : 0;
        target = Math.pow(avg / 255, 1.35);
      }

      const sVal = raySmooth[i];
      raySmooth[i] = target > sVal
        ? sVal + (target - sVal) * 0.55
        : sVal + (target - sVal) * 0.10;

      const amp = raySmooth[i];

      const a = -Math.PI / 2 + i * step + step / 2;
      const x0 = cx + Math.cos(a) * innerR;
      const y0 = cy + Math.sin(a) * innerR;
      const x1 = cx + Math.cos(a) * (innerR + amp * (maxR - innerR));
      const y1 = cy + Math.sin(a) * (innerR + amp * (maxR - innerR));

      const hue = 190 - amp * 60;
      const alpha = 0.15 + amp * 0.85;

      ctx2d.beginPath();
      ctx2d.lineWidth = Math.max(2, w / 200);
      ctx2d.lineCap = 'round';
      ctx2d.strokeStyle = `hsla(${hue}, 90%, ${55 + amp * 15}%, ${alpha})`;
      ctx2d.shadowBlur = 12 + amp * 22;
      ctx2d.shadowColor = `hsla(${hue}, 100%, 60%, ${alpha})`;
      ctx2d.moveTo(x0, y0);
      ctx2d.lineTo(x1, y1);
      ctx2d.stroke();

      if (amp > 0.25) {
        ctx2d.beginPath();
        ctx2d.fillStyle = `hsla(${hue}, 100%, 70%, ${alpha})`;
        ctx2d.arc(x1, y1, Math.max(1.5, w / 300) + amp * (w / 200), 0, Math.PI * 2);
        ctx2d.fill();
      }
    }

    const glowR = innerR * (0.9 + bassEnergy * 0.35);
    const grad = ctx2d.createRadialGradient(cx, cy, 0, cx, cy, glowR);
    grad.addColorStop(0, `hsla(190, 100%, 60%, ${0.10 + bassEnergy * 0.25})`);
    grad.addColorStop(1, 'hsla(190, 100%, 60%, 0)');
    ctx2d.beginPath();
    ctx2d.fillStyle = grad;
    ctx2d.arc(cx, cy, glowR, 0, Math.PI * 2);
    ctx2d.fill();

    // буквы имени — внутри того же цикла
    updateLetters();

    requestAnimationFrame(drawViz);
  }

  // запускаем главный цикл
  drawViz();

  /* ---------------- Плейлист ---------------- */
  function playCurrent() {
    if (!files.length) return;

    initAudioGraph();
    if (audioCtx && audioCtx.state === 'suspended') audioCtx.resume();

    if (objectURL) URL.revokeObjectURL(objectURL);
    objectURL = URL.createObjectURL(files[current]);
    audio.src = objectURL;

    playerName.textContent = files[current].name;
    playerStatus.textContent = '0:00 / 0:00';

    audio.play().catch(err => {
      console.error('Ошибка воспроизведения:', err);
      playerStatus.textContent = 'Не удалось воспроизвести';
    });
    btnPlay.textContent = '⏸';
    updateControls();
  }

  btnSelect.addEventListener('click', async () => {
    if (window.showOpenFilePicker) {
      try {
        const handles = await window.showOpenFilePicker({
          multiple: true,
          types: [{
            description: 'Аудио',
            accept: { 'audio/*': ['.mp3','.m4a','.aac','.wav','.ogg','.flac','.opus'] }
          }]
        });
        files = await Promise.all(handles.map(h => h.getFile()));
        current = 0;
        playCurrent();
      } catch (e) {
        if (e.name !== 'AbortError') console.error(e);
      }
    } else {
      const input = document.createElement('input');
      input.type = 'file';
      input.accept = 'audio/*';
      input.multiple = true;
      input.onchange = () => {
        if (!input.files.length) return;
        files = Array.from(input.files);
        current = 0;
        playCurrent();
      };
      input.click();
    }
  });

  btnPlay.addEventListener('click', () => {
    if (!files.length) return;

    initAudioGraph();
    if (audioCtx && audioCtx.state === 'suspended') audioCtx.resume();

    if (audio.paused) {
      audio.play();
      btnPlay.textContent = '⏸';
    } else {
      audio.pause();
      btnPlay.textContent = '▶';
    }
  });

  btnPrev.addEventListener('click', () => {
    if (current > 0) { current--; playCurrent(); }
  });
  btnNext.addEventListener('click', () => {
    if (current < files.length - 1) { current++; playCurrent(); }
  });

  audio.addEventListener('ended', () => {
    if (current < files.length - 1) {
      current++;
      playCurrent();
    } else {
      btnPlay.textContent = '▶';
      progressFill.style.width = '100%';
      playerStatus.textContent = fmtTime(audio.duration) + ' / ' + fmtTime(audio.duration);
    }
  });

  audio.addEventListener('timeupdate', () => {
    if (!audio.duration) return;
    const p = (audio.currentTime / audio.duration) * 100;
    progressFill.style.width = p + '%';
    playerStatus.textContent = fmtTime(audio.currentTime) + ' / ' + fmtTime(audio.duration);
  });

  progressBar.addEventListener('click', (e) => {
    if (!audio.duration) return;
    const rect = progressBar.getBoundingClientRect();
    const ratio = Math.min(Math.max((e.clientX - rect.left) / rect.width, 0), 1);
    audio.currentTime = ratio * audio.duration;
  });

  volumeSlider.addEventListener('input', () => {
    audio.volume = parseFloat(volumeSlider.value);
  });
  audio.volume = parseFloat(volumeSlider.value);

  updateControls();

})();
</script>
</body>
</html>
